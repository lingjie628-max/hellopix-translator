<text x="60" y="458" font-size="12.5" fill="#065F46" font-weight="700">✅ 三个套餐现在都能翻译：基础版靠 google，高级版有 deepseek / google，专业版 4 个都在</text>
<text x="60" y="482" font-size="11.5" fill="#2B3748">⚠ 一个重要教训：上一版把「wired=true」直接当成「能用」，因此漏掉了两个坏通道 —— deepseek 的端点被填成用量控制台页面（405），gpt 的模型不接受 temperature=0。</text>
<text x="60" y="504" font-size="11.5" fill="#2B3748">现在改用 scripts/probe-translate-engines.js 真实调用厂商 API 验证，「已接通」必须由实测背书。</text>
