<text x="60" y="458" font-size="12.5" fill="#B91C1C" font-weight="700">🔴 基础版 4 个商户一翻译就报错，且报的是「当前套餐未包含此通道」—— 商户看不懂为什么</text>
<text x="60" y="482" font-size="11.5" fill="#2B3748">三条路（任选）：① 给基础版加 deepseek（改 package_engines，最小改动）　② 把 google/niutrans 真正接通（配凭据）　③ 暂时下架基础版</text>
<text x="60" y="504" font-size="11.5" fill="#2B3748">上线前建议一并处理：7 个「可选中但未接通」的引擎，要么接通、要么从套餐里摘掉 —— 否则客服会被「翻译坏了」的工单淹没</text>
