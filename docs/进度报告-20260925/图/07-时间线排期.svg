<text x="40" y="540" font-size="12" fill="#172033" font-weight="700">★ 我的建议顺序：今天同时启动 ①（等证书）与 ②（你验收）——两者互不阻塞；③ 我随时能做，等你定方案；④ 我可以并行做完</text>
