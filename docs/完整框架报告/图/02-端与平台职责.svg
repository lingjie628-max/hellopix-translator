<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1092" viewBox="0 0 1100 546" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="1100" height="546" fill="#F7F9FC"/>
<text x="40" y="52" font-size="26" fill="#0F172A" font-weight="700">端与平台的职责分工</text>
<text x="40" y="78" font-size="14" fill="#667085">什么放在商户电脑上，什么必须放在平台上</text>
<rect x="40" y="108" width="324" height="300" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
<text x="60" y="140" font-size="17" fill="#065F46" font-weight="700">桌面客户端</text>
<text x="60" y="162" font-size="11.5" fill="#065F46">商户自己的电脑</text>
<path d="M60 178 L344 178" stroke="#86EFAC" stroke-width="1" fill="none"/>
<circle cx="66" cy="200" r="3" fill="#065F46"/>
<text x="78" y="204" font-size="12" fill="#2B3748">多开容器：一条线路一个独立会话分</text>
<text x="78" y="220" font-size="12" fill="#2B3748">区</text>
<circle cx="66" cy="240" r="3" fill="#065F46"/>
<text x="78" y="244" font-size="12" fill="#2B3748">登录态与 Cookie 不出本机</text>
<circle cx="66" cy="280" r="3" fill="#065F46"/>
<text x="78" y="284" font-size="12" fill="#2B3748">注入翻译浮层，鼠标划词即译</text>
<circle cx="66" cy="320" r="3" fill="#065F46"/>
<text x="78" y="324" font-size="12" fill="#2B3748">代理（SOCKS5 / HTTP</text>
<text x="78" y="340" font-size="12" fill="#2B3748"> / SSH）逐线路绑定</text>
<circle cx="66" cy="360" r="3" fill="#065F46"/>
<text x="78" y="364" font-size="12" fill="#2B3748">只上报翻译文本与线路心跳</text>
<rect x="388" y="108" width="324" height="300" rx="10" fill="#EAF2FF" stroke="#C7D6EE" stroke-width="1"/>
<text x="408" y="140" font-size="17" fill="#1E3A8A" font-weight="700">平台服务</text>
<text x="408" y="162" font-size="11.5" fill="#1E3A8A">唯一可信计算方</text>
<path d="M408 178 L692 178" stroke="#C7D6EE" stroke-width="1" fill="none"/>
<circle cx="414" cy="200" r="3" fill="#1E3A8A"/>
<text x="426" y="204" font-size="12" fill="#2B3748">持有九条翻译通道的 API 密钥</text>
<circle cx="414" cy="240" r="3" fill="#1E3A8A"/>
<text x="426" y="244" font-size="12" fill="#2B3748">按字符计费：预留 → 提交 / </text>
<text x="426" y="260" font-size="12" fill="#2B3748">回滚</text>
<circle cx="414" cy="280" r="3" fill="#1E3A8A"/>
<text x="426" y="284" font-size="12" fill="#2B3748">商户、子账号、套餐、订单、充值</text>
<circle cx="414" cy="320" r="3" fill="#1E3A8A"/>
<text x="426" y="324" font-size="12" fill="#2B3748">客户身份指纹与跨商户碰撞检测</text>
<circle cx="414" cy="360" r="3" fill="#1E3A8A"/>
<text x="426" y="364" font-size="12" fill="#2B3748">超管后台、审计日志、版本分发</text>
<rect x="736" y="108" width="324" height="300" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="756" y="140" font-size="17" fill="#667085" font-weight="700">商户内网</text>
<text x="756" y="162" font-size="11.5" fill="#667085">规划中，尚未实现</text>
<path d="M756 178 L1040 178" stroke="#CBD5E1" stroke-width="1" fill="none"/>
<circle cx="762" cy="200" r="3" fill="#667085"/>
<text x="774" y="204" font-size="12" fill="#2B3748">工单池本地化（设计已完成）</text>
<circle cx="762" cy="240" r="3" fill="#667085"/>
<text x="774" y="244" font-size="12" fill="#2B3748">客户聊天记录本地留存</text>
<circle cx="762" cy="280" r="3" fill="#667085"/>
<text x="774" y="284" font-size="12" fill="#2B3748">本地服务台与自动回复引擎</text>
<circle cx="762" cy="320" r="3" fill="#667085"/>
<text x="774" y="324" font-size="12" fill="#2B3748">与平台只交换计费凭据</text>
<circle cx="762" cy="360" r="3" fill="#667085"/>
<text x="774" y="364" font-size="12" fill="#2B3748">需要商户自备一台常驻机器</text>
<rect x="40" y="428" width="1020" height="96" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="456" font-size="13" fill="#334155" font-weight="700">为什么必须这样切</text>
<text x="60" y="482" font-size="12.5" fill="#2B3748">翻译一定经过平台：通道密钥在平台手里，计费按字符，平台无法在不看到明文的前提下计费。</text>
<text x="60" y="504" font-size="12.5" fill="#2B3748">所以正确做法不是“不让平台看到”，而是“平台看过即弃”——只在内存中过一遍，不落库、不建立与客户身份的关联。</text>
</svg>
