<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1288" viewBox="0 0 1100 644" font-family="PingFang SC, Hiragino Sans GB, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="1100" height="644" fill="#F7F9FC"/>
<text x="40" y="52" font-size="26" fill="#0F172A" font-weight="700">卡点与依赖关系</text>
<text x="40" y="78" font-size="14" fill="#667085">哪些必须你先做，哪些我可以并行推进</text>
<rect x="40" y="108" width="500" height="364" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
<text x="60" y="138" font-size="14" fill="#B91C1C" font-weight="700">必须由你操作（我无法代做）</text>
<text x="60" y="168" font-size="12.5" fill="#7F1D1D" font-weight="700">邮件服务</text>
<rect x="196" y="155" width="34" height="18" rx="5" fill="#DC2626"/>
<text x="213" y="168" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">P0</text>
<text x="60" y="188" font-size="11" fill="#2B3748">阿里云邮件推送开通 + SPF / DKIM 解析 + 发信地址，</text>
<text x="60" y="224" font-size="10.5" fill="#B91C1C">5 个 SMTP 值填进后台 → 注册才能收到验证码</text>
<text x="60" y="246" font-size="12.5" fill="#7F1D1D" font-weight="700">TRC20 收款地址</text>
<rect x="196" y="233" width="34" height="18" rx="5" fill="#DC2626"/>
<text x="213" y="246" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">P0</text>
<text x="60" y="266" font-size="11" fill="#2B3748">在超管后台「收款方式」填入 TRC20 地址</text>
<text x="60" y="302" font-size="10.5" fill="#B91C1C">不解决：用户充值没有收款去处</text>
<text x="60" y="324" font-size="12.5" fill="#7F1D1D" font-weight="700">客户端实机验证</text>
<rect x="196" y="311" width="34" height="18" rx="5" fill="#DC2626"/>
<text x="213" y="324" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">P0</text>
<text x="60" y="344" font-size="11" fill="#2B3748">在 Windows 上连真实 Telegram / WhatsApp</text>
<text x="60" y="360" font-size="11" fill="#2B3748"> 实测</text>
<text x="60" y="380" font-size="10.5" fill="#B91C1C">不解决：不确定真实聊天窗口能否取到文本</text>
<text x="60" y="402" font-size="12.5" fill="#7F1D1D" font-weight="700">其余 7 条通道</text>
<rect x="196" y="389" width="34" height="18" rx="5" fill="#F59E0B"/>
<text x="213" y="402" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">P1</text>
<text x="60" y="422" font-size="11" fill="#2B3748">分别申请密钥并填入超管后台「翻译通道」</text>
<text x="60" y="458" font-size="10.5" fill="#B91C1C">不解决：只有 GPT / DeepSeek 可用</text>
<rect x="560" y="108" width="500" height="364" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
<text x="580" y="138" font-size="14" fill="#065F46" font-weight="700">我可以并行推进（不影响上线）</text>
<text x="580" y="172" font-size="12.5" fill="#065F46" font-weight="700">工单池本地化</text>
<text x="580" y="190" font-size="11" fill="#2B3748">设计已完成，等你选 A / B / C 方案与本地服务形态</text>
<text x="580" y="224" font-size="12.5" fill="#065F46" font-weight="700">字段级加密接线</text>
<text x="580" y="242" font-size="11" fill="#2B3748">模块已写好但没接线，等有真实数据再开</text>
<text x="580" y="276" font-size="12.5" fill="#065F46" font-weight="700">磁盘加密</text>
<text x="580" y="294" font-size="11" fill="#2B3748">需要一次停机窗口，建议等业务空档</text>
<text x="580" y="328" font-size="12.5" fill="#065F46" font-weight="700">监控与告警</text>
<text x="580" y="346" font-size="11" fill="#2B3748">脚本已就位，可以补一台外部探活</text>
<text x="580" y="380" font-size="12.5" fill="#065F46" font-weight="700">第三方安全体检</text>
<text x="580" y="398" font-size="11" fill="#2B3748">可约一次外部渗透，验证超管后台边界</text>
<rect x="40" y="492" width="1020" height="132" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="60" y="520" font-size="13" fill="#334155" font-weight="700">依赖链：一条链断了，后面的都动不了</text>
<rect x="60" y="538" width="168" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
<text x="144" y="565" font-size="12.5" fill="#172033" font-weight="700" text-anchor="middle">邮件服务</text>
<path d="M228 560 L254 560" stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="256" y="538" width="168" height="44" rx="8" fill="#EAF2FF" stroke="#C7D6EE" stroke-width="1"/>
<text x="340" y="565" font-size="12.5" fill="#172033" font-weight="700" text-anchor="middle">商户注册</text>
<path d="M424 560 L450 560" stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="452" y="538" width="168" height="44" rx="8" fill="#EAF2FF" stroke="#C7D6EE" stroke-width="1"/>
<text x="536" y="565" font-size="12.5" fill="#172033" font-weight="700" text-anchor="middle">真实商户入驻</text>
<path d="M620 560 L646 560" stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="648" y="538" width="168" height="44" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
<text x="732" y="565" font-size="12.5" fill="#172033" font-weight="700" text-anchor="middle">充值下单</text>
<path d="M816 560 L842 560" stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<rect x="844" y="538" width="168" height="44" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
<text x="928" y="565" font-size="12.5" fill="#172033" font-weight="700" text-anchor="middle">真实计费</text>
<text x="60" y="608" font-size="12" fill="#B91C1C" font-weight="700">阻断点只有第一个：邮件服务不通，注册流程就走不完，后面整条链都是空的。</text>
</svg>
