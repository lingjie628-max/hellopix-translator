# systemd drop-in：启动前自检 + 崩溃退避
#
# 来源：2026-10-23 从生产机 /etc/systemd/system/hello-pix.service.d/preflight.conf 取回。
# 安装位置：/etc/systemd/system/hello-pix.service.d/preflight.conf
#
# ## 为什么需要这个
#
# 2026-10-21：core-service.js 依赖 desktop/shared/platforms.js，该文件缺失时
# 服务以 Restart=always 每 5 秒重启一次，累计 19 次，导致全站 502。
# 加上 preflight 之后，缺文件直接退出（EX_CONFIG=78），配合 StartLimit
# 进入 failed 而不是无限重启 —— 日志里看到的是"缺哪个文件"，
# 而不是刷屏的 502。
#
# ## 2026-10-23 的事故：这个文件自己被删了
#
# deploy-code.sh 把 scripts/ 整目录替换成仓库版本，而 preflight.sh 当时
# 只存在于生产、仓库里没有 —— 于是被删掉 → ExecStartPre 指向不存在的文件
# → systemd 报 203/EXEC → 服务起不来 → 全站 API 000。
#
# 两处补救都已落地：
#   1. scripts/preflight.sh 纳入仓库（不再只活在生产）
#   2. deploy-code.sh 保留"生产有、仓库没有"的 scripts/ 文件

[Unit]
# 5 分钟内最多 5 次启动，超限进入 failed 而非无限循环
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# 自检在迁移之前执行，缺文件直接退出（EX_CONFIG=78）
ExecStartPre=
ExecStartPre=/opt/hello-pix/scripts/preflight.sh /opt/hello-pix
ExecStartPre=/usr/bin/node scripts/migrate.js up

# 退避重试
Restart=on-failure
RestartSec=10
