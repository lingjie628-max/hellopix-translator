# Retired public domain.
#
# jfbaibaox.com is still present in Cloudflare DNS, but it must not expose any
# Hello Pix site. Without this dedicated virtual host, Nginx falls through to
# its first server block and serves the application under the retired host.
#
# 410 is intentional: it tells browsers and crawlers that the resource was
# permanently retired, while keeping DNS/proxy configuration untouched.

server {
    listen 80;
    listen [::]:80;
    server_name jfbaibaox.com www.jfbaibaox.com;
    server_tokens off;
    add_header Cache-Control "no-store" always;
    return 410 "This domain has been retired.\n";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jfbaibaox.com www.jfbaibaox.com;
    server_tokens off;

    # Cloudflare already proxies this hostname. Reuse the origin certificate
    # that the previous default server presented; browsers see Cloudflare's
    # edge certificate, while this keeps Cloudflare Full mode working.
    ssl_certificate     /etc/letsencrypt/live/lindufyht.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindufyht.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Cache-Control "no-store" always;
    return 410 "This domain has been retired.\n";
}
