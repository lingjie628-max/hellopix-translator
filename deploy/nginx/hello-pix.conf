limit_req_zone $binary_remote_addr zone=pix_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pix_auth:10m rate=5r/m;

upstream hello_pix_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pix.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pix.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pix.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP 与 server/security.js 保持一致。注意**两边都要改**：
    # 静态资源由 nginx 直接发（不经 Node），所以 nginx 这份才是页面的真实 CSP；
    # Node 那份只作用于 /apis 响应。只改一边就会出现"页面 CSP 比 API 松"。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    root /opt/hello-pix/dist;
    index index.html;

    # ★ 后台 API 的 IP 白名单（最后一道独立防线）★
    #
    # 应用层鉴权防的是"没有权限"；这一层防的是"**有权限但不是你**" ——
    # 会话被偷、密码泄露、未知 XSS、浏览器插件劫持 cookie。这些情况下
    # Express 那边已经认定他是合法超管，只有网络位置还能说话。
    #
    # 放行哪些地址写在 /etc/nginx/pix-admin-allow/*.conf 里，
    # 见 deploy/nginx/admin-allowlist.conf.example 的说明。
    #
    # 为什么用"通配符 + 专用子目录"而不是 include 一个固定文件名：
    #
    #   1. 通配符 include 匹配不到任何文件时，nginx 视为空操作，配置照常通过；
    #      而 include 一个**具名**文件若不存在，nginx 直接 `[emerg]` 起不来。
    #      我们希望在"没建白名单"时服务完全正常 —— 实测过这两种行为。
    #   2. 用专用子目录而不是 /etc/nginx/snippets/，是因为通配符会把目录里
    #      **所有** .conf 都引进来。实测 `include snippets/*.conf` 会把别人放的
    #      add_header / proxy_set_header 也串进这个 location，等于埋雷。
    #      限定在 pix-admin-allow/ 下，语义就是"这里只放白名单"。
    #
    # 所以：没建这个目录 = 不启用白名单，行为与加这道闸之前完全一致。
    location /apis/admin/ {
        include /etc/nginx/pix-admin-allow/*.conf;
        proxy_pass http://hello_pix_node;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/apis/(login|client/login|admin/login)$ {
        limit_req zone=pix_auth burst=3 nodelay;
        proxy_pass http://hello_pix_node;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # 只写真实对端 IP，**不用** $proxy_add_x_forwarded_for。
        # 后者是「追加」语义：攻击者自己带一个 X-Forwarded-For: 1.2.3.4 过来，
        # nginx 会拼成「1.2.3.4, 真实IP」，而 Express 取最左值 —— 于是 req.ip
        # 变成攻击者随便填的任何地址，按 IP 的限流、审计、会话绑定全部可绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /apis/ {
        limit_req zone=pix_api burst=20 nodelay;
        proxy_pass http://hello_pix_node;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # 只写真实对端 IP，**不用** $proxy_add_x_forwarded_for。
        # 后者是「追加」语义：攻击者自己带一个 X-Forwarded-For: 1.2.3.4 过来，
        # nginx 会拼成「1.2.3.4, 真实IP」，而 Express 取最左值 —— 于是 req.ip
        # 变成攻击者随便填的任何地址，按 IP 的限流、审计、会话绑定全部可绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://hello_pix_node;
    }
}
