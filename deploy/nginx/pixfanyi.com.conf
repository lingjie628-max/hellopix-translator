# ⚠️ 这份是**生产实际使用的**站点配置，不是模板。
#
# 来源：2026-10-23 从生产机 /etc/nginx/sites-enabled/pixfanyi.com.conf 原样取回。
#
# 为什么之前仓库里的 hello-pix.conf 和生产完全对不上：
#   deploy-code.sh 只推 server/ migrations/ dist/ scripts/，
#   **不推 nginx 配置**。生产那份是 setup-domains.sh 生成的，之后又被
#   手工改过（加 /admin 封锁、/downloads 处理），仓库里那份只是早期模板。
#   结果就是"照仓库改"会改到一份根本不负责任的配置上。
#
# 现在以这份为准。修改后同步到生产：
#   scp 到 /etc/nginx/sites-enabled/pixfanyi.com.conf
#   nginx -t && systemctl reload nginx
#
# 依赖：
#   /etc/nginx/snippets/hello-pix-proxy.conf   （反代公共参数，见同目录）
#   /etc/systemd/system/hello-pix.service.d/preflight.conf
#   限流 zone hp_general 定义在 /etc/nginx/conf.d/ 下

# Hello Pix · pixfanyi.com · HTTPS
# 由 deploy/nginx/setup-domains.sh 生成于 20260914132725
server {
    listen 80;
    listen [::]:80;
    server_name pixfanyi.com www.pixfanyi.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixfanyi.com www.pixfanyi.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pixfanyi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixfanyi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HP_SSL:5m;
    ssl_session_timeout 1h;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 边缘限流，与应用层 Redis 限流互补（应用层仍是权威）
    limit_req zone=hp_general burst=60 nodelay;
    limit_req_status 429;

    # ── 纵深防御：公网域名上不暴露超管入口与超管接口 ──────────────────
    #
    # 注意 /admin 这条**也是大小写敏感**的。但后台页面不区分大小写没意义 ——
    # 页面本身是 SPA，真正有价值的是下面的 API 封锁。这里保持原样，
    # 因为改成不区分大小写会把 /AdminUsers 之类的前端路由也一起 404。
    location ^~ /admin {
        return 404;
    }
    # 不区分大小写的正则。原本是 `location ^~ /apis/admin/`，
    # 而 `^~` 前缀匹配区分大小写，Express 路由却不区分 ——
    # /apis/ADMIN/staff/save 会绕过这一层直接打到 Node。
    # 2026-10-23 入侵用的正是这个大小写差。实测修复前：
    #   404 /apis/admin/staff/save    ← 拦住
    #   401 /apis/ADMIN/staff/save    ← 漏到 Node（靠能力表兜住）
    # 401 说明应用层扛住了，但纵深防御的意义就是单层失效还有第二层。
    location ~* ^/apis/admin(/|$) {
        return 404;
    }

    # 客户端安装包由 nginx 直接读盘发送（零拷贝）。
    # 交给 Node 应用发 = 让单进程事件循环去搬几百 MB，而同机还有其他业务。
    # 注意目录刻意放在 /opt/hello-pix/downloads（**不在 dist 下**）：
    # 每次发布都会整体替换 dist，放在里面会被一起换掉（实测丢过一次）。
    location ^~ /downloads/ {
        alias /opt/hello-pix/downloads/;
        sendfile on;
        tcp_nopush on;
        autoindex off;
        # 安装包**必须每次回源校验**，不能用 max-age 盲缓存。
        #
        # 出过事故：0.1.4 构建完成后原地重传（同名、内容变了），
        # 但 CDN 里那份还是旧的、且带着 24 小时新鲜期 ——
        # 官网显示的是 0.1.4，用户下到的却是不含修复的旧字节，
        # 而源站文件明明是对的。这类问题极难发现：链接能下、能装、能跑，
        # 只是少了一段修复。
        #
        # no-cache 不是"不缓存"，而是"每次都要回源确认"：
        # 内容没变时回 304（几乎零开销，CDN 照旧省流量），
        # 内容一变立刻生效，不需要清 CDN、也不需要等 TTL 过期。
        # 代价是每次下载多一个条件请求 —— 对一个 80MB 的安装包可以忽略。
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include /etc/nginx/snippets/hello-pix-proxy.conf;
    }
}
