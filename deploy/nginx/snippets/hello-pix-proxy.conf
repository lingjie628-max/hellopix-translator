# Hello Pix 反向代理公共参数
#
# 来源：2026-10-23 从生产机 /etc/nginx/snippets/hello-pix-proxy.conf 原样取回。
# 由 deploy/nginx/pixfanyi.com.conf 的 `location /` 引用。
#
# ⚠️ 不要在这里清空 X-Forwarded-For ——
# 下面写的是 $remote_addr（覆盖），不是 $proxy_add_x_forwarded_for（追加）。
# 追加语义会让攻击者自带的 X-Forwarded-For 拼在最左边，Express 取最左值，
# 于是 req.ip 变成任意值：按 IP 的限流、审计、会话网段绑定全部可绕过。

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# 已经由 real_ip 模块消费成 $remote_addr，清掉避免下游误信客户端伪造值
proxy_set_header CF-Connecting-IP "";
proxy_hide_header Server;
proxy_read_timeout 120s;
